<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livros</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Sistema de Biblioteca</h1>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>
<h2>Livros</h2>

<form th:action="@{/livros}" method="post">
    <input type="text" name="titulo" placeholder="Título">
    <input type="text" name="autor" placeholder="Autor">
    <input type="text" name="isbn" placeholder="ISBN">
    <button type="submit">Cadastrar</button>
</form>

<table>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Ação</th>
    </tr>
    <tr th:each="l, status : ${livros}">
        <td th:text="${l.titulo}"></td>
        <td th:text="${l.autor}"></td>
        <td th:text="${l.isbn}"></td>
        <td>
            <form th:action="@{/livros/excluir/{i}(i=${status.index})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
