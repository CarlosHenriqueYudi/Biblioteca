<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livros</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Sistema de Biblioteca</h1>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>
<h2>Empréstimos</h2>

<form th:action="@{/emprestimos}" method="post">
    <input type="text" name="retirada" placeholder="Retirada (dd/mm/aaaa)">
    <input type="text" name="devolucao" placeholder="Devolução (dd/mm/aaaa)">
    <button type="submit">Cadastrar</button>
</form>

<table>
    <tr>
        <th>Retirada</th>
        <th>Devolução</th>
        <th>Ação</th>
    </tr>
    <tr th:each="e, status : ${emprestimos}">
        <td th:text="${e.retirada}"></td>
        <td th:text="${e.devolucao}"></td>
        <td>
            <form th:action="@{/emprestimos/excluir/{i}(i=${status.index})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
