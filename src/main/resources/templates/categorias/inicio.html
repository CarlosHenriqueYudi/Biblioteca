<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livros</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Sistema de Biblioteca</h1>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>
<h2>Categorias</h2>

<form th:action="@{/categorias}" method="post">
    <input type="text" name="genero" placeholder="Gênero">
    <input type="text" name="area" placeholder="Área">
    <button type="submit">Cadastrar</button>
</form>

<table>
    <tr>
        <th>Gênero</th>
        <th>Área</th>
        <th>Ação</th>
    </tr>
    <tr th:each="c, status : ${categorias}">
        <td th:text="${c.genero}"></td>
        <td th:text="${c.area}"></td>
        <td>
            <form th:action="@{/categorias/excluir/{i}(i=${status.index})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
