<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livros</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Sistema de Biblioteca</h1>
<nav>
    <a th:href="@{/}">Início</a>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>
<h2>Usuários</h2>

<form th:action="@{/usuarios}" method="post">
    <input type="text" name="nome" placeholder="Nome">
    <input type="text" name="CPF" placeholder="CPF">
    <button type="submit">Cadastrar</button>
</form>

<table>
    <tr>
        <th>Nome</th>
        <th>CPF</th>
        <th>Ação</th>
    </tr>
    <tr th:each="u, status : ${usuarios}">
        <td th:text="${u.nome}"></td>
        <td th:text="${u.CPF}"></td>
        <td>
            <form th:action="@{/usuarios/excluir/{i}(i=${status.index})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
